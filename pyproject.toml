[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proton"
version = "0.1.0"
description = "Physics-informed Radiation Operator and Time-series Optimized Network"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
spectrometer = ["radiacode>=0.3.5"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
# This is to pick up proton and every subpackage under it
include = ["proton*"]

[tool.pytest.ini_options]
testpaths = ["tests"]